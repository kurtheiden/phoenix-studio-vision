[package]
name = "phoenix"
version = "0.1.0"
edition = "2021"
description = "A format-neutral binary inspection tool for the Phoenix project"
license = "MIT"
repository = "https://github.com/kurtheiden/phoenix-studio-vision"
rust-version = "1.70"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "0.10"

[profile.release]
panic = "unwind"
